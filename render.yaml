services:
  - type: web
    name: mayros
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: MAYROS_STATE_DIR
        value: /data/.mayros
      - key: MAYROS_WORKSPACE_DIR
        value: /data/workspace
      - key: MAYROS_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: mayros-data
      mountPath: /data
      sizeGB: 1
