services:
  mayros-gateway:
    image: ${MAYROS_IMAGE:-mayros:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      MAYROS_GATEWAY_TOKEN: ${MAYROS_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${MAYROS_CONFIG_DIR}:/home/node/.mayros
      - ${MAYROS_WORKSPACE_DIR}:/home/node/.mayros/workspace
    ports:
      - "${MAYROS_GATEWAY_PORT:-18789}:18789"
      - "${MAYROS_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${MAYROS_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  mayros-cli:
    image: ${MAYROS_IMAGE:-mayros:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      MAYROS_GATEWAY_TOKEN: ${MAYROS_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${MAYROS_CONFIG_DIR}:/home/node/.mayros
      - ${MAYROS_WORKSPACE_DIR}:/home/node/.mayros/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
